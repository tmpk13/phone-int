[package]
name = "cld-phone-worker"
description = "Cloudflare Worker that relays messages and files between Claude and a phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
cld-phone-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
worker = { version = "0.8", features = ["d1"] }
# Token and file id randomness from crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
