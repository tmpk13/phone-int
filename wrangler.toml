name = "cld-phone"
main = "worker/build/worker/shim.mjs"
compatibility_date = "2026-06-01"

# Variables set in the dashboard (such as NTFY_PREVIEW) survive deploys.
keep_vars = true

# No ids: the first deploy creates the database and the bucket, and later
# deploys keep using them. The worker creates its own tables.
[[d1_databases]]
binding = "DB"

[[r2_buckets]]
binding = "FILES"

# Daily cleanup of old messages, files and idle devices.
[triggers]
crons = ["23 4 * * *"]
